name: APP NAME CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-name-production
  cancel-in-progress: false

jobs:
  pipeline:
    uses: Holden-Installations/shared-workflows/.github/workflows/monday-deploy.yml@main
    with:
      app_id: '12668173'
      app_name: 'Leadership Reporting'
    secrets:
      MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
